# Run by hand (Actions → Smoke test → Run workflow): installs the app on an Android emulator and an
# iPhone simulator, opens it, and keeps screenshots, to check it starts on real devices.
name: Smoke test

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n io.github.scoregie.familyhealthplanner/.MainActivity
            sleep 15
            mkdir -p shots
            adb exec-out screencap -p > shots/android-first-launch.png
            adb logcat -d | grep -iE "Capacitor|chromium|AndroidRuntime" | tail -80 > shots/android-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: shots/

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx cap sync ios
      - name: Build, install and open on a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone 1[0-9][^(]*\(([0-9A-F-]+)\)" | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build -quiet
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" io.github.scoregie.familyhealthplanner
          sleep 15
          mkdir -p "$GITHUB_WORKSPACE/shots"
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/shots/ios-first-launch.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: shots/
