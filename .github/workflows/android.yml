# Builds the Android app for every change: a test APK (install it straight onto a phone) and an
# app bundle (.aab) for Google Play, signed with the upload key if its secrets are set
# (see docs/publishing.md). For a release tag (v1.2.3), both are attached to the GitHub release.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      - name: Test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload key (if set)
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: App bundle for Google Play
        working-directory: android
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --no-daemon bundleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew --no-daemon bundleRelease
          fi
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Name the files
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/family-health-planner-$V-test.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/family-health-planner-$V${{ steps.key.outputs.signed == 'true' && '' || '-unsigned' }}.aab"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" out/* --clobber
